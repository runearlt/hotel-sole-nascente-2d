<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1d3741">
  <title>Hotel Sole Nascente | Managerial Economics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>HOTEL SOLE NASCENTE<small>MANAGERIAL ECONOMICS</small></span></div>
      <nav class="tabs" aria-label="Main views"><button type="button" data-view="town" class="active">Town</button><button type="button" data-view="notebook">Notebook <span id="notebook-count">0</span></button></nav>
      <div class="header-right"><span id="case-label">DEMONSTRATION CASE</span><button type="button" id="restart" title="Restart simulation">↺ <span>Restart</span></button></div>
    </header>
    <main id="main"></main>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
