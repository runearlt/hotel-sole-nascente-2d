name: Student exercise checks

on:
  pull_request:
    branches: [development, main, working-version, open-version-api, api-version]
  push:
    branches: [development, main, working-version, open-version-api, api-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify offline actor integration and student exercises
        run: npm run test:offline
      - name: Keep verification results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-student-verification
          path: test-artifacts/
          if-no-files-found: ignore
